name: Content

on:
  push:
    paths:
      - docs/**
      - tools/validate/**
      - tools/content/**
      - content/**
      - .github/workflows/content.yml
  pull_request:
    paths:
      - docs/**
      - tools/validate/**
      - tools/content/**
      - content/**
      - .github/workflows/content.yml
  workflow_dispatch:

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content:
    name: Content validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/validate/package-lock.json
      - run: npm ci
      - run: npm test
      # TODO: drop --partial once all courses are fully authored.
      - run: node validate.mjs --partial
      - run: node ../content/build-pack.mjs --check
